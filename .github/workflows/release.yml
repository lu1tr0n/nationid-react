name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # changesets/action needs `contents: write` to push tags and the
      # release commit, `pull-requests: write` to open the release PR,
      # and `id-token: write` for the OIDC identity used by both npm
      # Trusted Publishing (replaces NPM_TOKEN) and sigstore provenance.
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm CLI for Trusted Publisher OIDC
        # Node 22 LTS ships with npm 10.x. npm Trusted Publishing requires
        # npm 11.5.1+ for the OIDC token exchange against the npm registry.
        # Pinned (not @latest) so Scorecard's Pinned-Dependencies check passes
        # and publish behaviour stays reproducible; bump deliberately.
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pipeline
        run: pnpm verify

      - name: Create release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # `pnpm run version` not `pnpm version` — the latter is pnpm's built-in
          # npm-style version-manipulation command and silently no-ops here.
          version: pnpm run version
          publish: pnpm run release
          commit: "chore: release"
          title: "chore: release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN is consumed by `changesets/action` itself: when it sees
          # the env var, it authenticates `npm publish` with the classic
          # token. When the env var is absent, the action flips into Trusted
          # Publishing (OIDC) mode — but TP cannot be configured for a
          # package that does not yet exist on npm, so the very first publish
          # needs the classic token. After v0.0.1 lands and Trusted
          # Publishing is configured at
          # https://www.npmjs.com/package/@nationid/react/access, the
          # NPM_TOKEN repository secret can be deleted; this expression then
          # collapses to the empty string, the env var is dropped, and every
          # subsequent release authenticates via OIDC. Provenance
          # attestation is emitted in both paths because the job has
          # `id-token: write` and runs in GitHub Actions.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
